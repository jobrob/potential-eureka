[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heat-game"
version = "0.1.0"
description = "HEAT: Pedal to the Metal board game simulation engine and AI"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "tqdm",
]

[project.optional-dependencies]
ml = ["torch", "gymnasium", "stable-baselines3", "sb3-contrib", "tensorboard"]
dev = ["pytest", "pytest-cov", "mypy", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (e.g. subprocess smoke tests)",
]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.ruff]
line-length = 100
