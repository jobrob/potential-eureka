[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heat-game"
version = "0.1.0"
description = "HEAT: Pedal to the Metal board game simulation engine and AI"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "tqdm",
]

[project.optional-dependencies]
# The default [ml] extra is CPU-only and must stay so (CPU-only machines must
# keep working). For GPU training (Sprint 6C, only worth it with vectorized
# envs + the large net profile), install a CUDA torch wheel separately, e.g.:
#   pip install --index-url https://download.pytorch.org/whl/cu124 torch
# then `pip install -e ".[ml]"`. resolve_device("cuda") falls back to CPU with
# a warning when no GPU/CUDA wheel is present, so this stays optional.
ml = ["torch", "gymnasium", "stable-baselines3", "sb3-contrib", "tensorboard"]
dev = ["pytest", "pytest-cov", "mypy", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (e.g. subprocess smoke tests)",
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
line-length = 100
